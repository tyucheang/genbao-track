<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenBao - Order Tracking Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .chat-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            height: 700px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }
        .message.user {
            justify-content: flex-end;
        }
        .message.ai {
            justify-content: flex-start;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin: 0 10px;
            flex-shrink: 0;
        }
        .message.user .avatar {
            background: #667eea;
            order: 2;
        }
        .message.ai .avatar {
            background: #764ba2;
        }
        .bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.user .bubble {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.ai .bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .chat-input {
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .chat-input input:focus {
            border-color: #667eea;
        }
        .chat-input button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .chat-input button:hover {
            transform: scale(1.05);
        }
        .chat-input button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .typing {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        .status-flow {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .status-step {
            text-align: center;
            flex: 1;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ddd;
            margin: 0 auto 5px;
        }
        .status-step.active .status-dot {
            background: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
        }
        .status-step.completed .status-dot {
            background: #4caf50;
        }
        .status-label {
            font-size: 10px;
            color: #999;
        }
        .status-step.active .status-label {
            color: #667eea;
            font-weight: 600;
        }
        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .quick-reply {
            padding: 8px 16px;
            background: #f0f0f0;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quick-reply:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .tracking-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .tracking-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🎯 GenBao</h1>
            <p>Order Tracking Assistant</p>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <!-- Welcome message -->
            <div class="message ai">
                <div class="avatar">🤖</div>
                <div class="bubble">
                    Hello! I'm GenBao, your order tracking assistant. 📦<br><br>
                    To check your order status, please provide:<br>
                    1. Order Number (e.g., BP111)<br>
                    2. Recipient Name for verification<br><br>
                    How can I help you today?
                    <div class="quick-replies">
                        <span class="quick-reply" onclick="sendQuickReply('Check order BP111')">Check order BP111</span>
                        <span class="quick-reply" onclick="sendQuickReply('Where is my order?')">Where is my order?</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        // Order status flow
        const statusFlow = ['Order Received', 'Design', 'Production', 'Assembly', 'Packaging', 'Shipped', 'Delivered'];
        
        // Mock data for demo
        const mockOrders = {
            'BP111': {
                orderId: 'BP111',
                customerName: 'John Smith',
                recipientName: 'John Smith',
                currentStep: 'Production',
                updateTime: '2025-03-07 15:21:12',
                trackingNumber: 'TRK123456789',
                trackingUrl: 'https://example.com/track/TRK123456789'
            },
            'TEST001': {
                orderId: 'TEST001',
                customerName: 'Test Customer',
                recipientName: 'Zhang San',
                currentStep: 'Assembly',
                updateTime: '2025-03-07 15:24:48',
                trackingNumber: '',
                trackingUrl: ''
            }
        };
        
        // Conversation state
        let conversationState = {
            waitingFor: null, // 'orderId' or 'recipientName'
            tempOrderId: null
        };

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendQuickReply(text) {
            document.getElementById('userInput').value = text;
            sendMessage();
        }

        function addMessage(text, isUser) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;
            messageDiv.innerHTML = `
                <div class="avatar">${isUser ? '👤' : '🤖'}</div>
                <div class="bubble">${text}</div>
            `;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showTyping() {
            const messagesDiv = document.getElementById('chatMessages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai typing-indicator';
            typingDiv.innerHTML = `
                <div class="avatar">🤖</div>
                <div class="bubble typing">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            messagesDiv.appendChild(typingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return typingDiv;
        }

        function removeTyping(typingDiv) {
            typingDiv.remove();
        }

        function generateStatusFlow(currentStep) {
            const currentIndex = statusFlow.indexOf(currentStep);
            let flowHtml = '<div class="status-flow">';
            
            statusFlow.forEach((step, index) => {
                let statusClass = '';
                if (index < currentIndex) statusClass = 'completed';
                else if (index === currentIndex) statusClass = 'active';
                
                flowHtml += `
                    <div class="status-step ${statusClass}">
                        <div class="status-dot"></div>
                        <div class="status-label">${step}</div>
                    </div>
                `;
            });
            
            flowHtml += '</div>';
            return flowHtml;
        }

        function processMessage(message) {
            const lowerMsg = message.toLowerCase();
            
            // Check if asking to check order
            if (lowerMsg.includes('check') || lowerMsg.includes('order') || lowerMsg.includes('bp') || lowerMsg.includes('status')) {
                // Extract order ID (BP followed by numbers, or any word)
                const orderMatch = message.match(/(BP\d+|TEST\d+|\b\d{3,}\b)/i);
                
                if (orderMatch) {
                    const orderId = orderMatch[1].toUpperCase();
                    conversationState.tempOrderId = orderId;
                    conversationState.waitingFor = 'recipientName';
                    
                    return `I found order <strong>${orderId}</strong>. 🔍<br><br>For security, please provide the <strong>recipient name</strong> to verify your identity.`;
                } else {
                    conversationState.waitingFor = 'orderId';
                    return `Please provide your order number. It should look like "BP111" or similar.`;
                }
            }
            
            // Check if providing recipient name (when waiting for it)
            if (conversationState.waitingFor === 'recipientName') {
                const orderId = conversationState.tempOrderId;
                const order = mockOrders[orderId];
                
                if (order) {
                    // Simple verification (in real app, check against database)
                    if (message.toLowerCase().includes(order.recipientName.toLowerCase()) || 
                        message.toLowerCase().includes(order.customerName.toLowerCase())) {
                        
                        conversationState.waitingFor = null;
                        conversationState.tempOrderId = null;
                        
                        let response = `✅ <strong>Verification Successful!</strong><br><br>`;
                        response += `<strong>Order ID:</strong> ${order.orderId}<br>`;
                        response += `<strong>Current Status:</strong> ${order.currentStep}<br>`;
                        response += `<strong>Last Updated:</strong> ${order.updateTime}<br><br>`;
                        response += generateStatusFlow(order.currentStep);
                        
                        if (order.trackingUrl) {
                            response += `<br>📮 <strong>Tracking:</strong> <a href="${order.trackingUrl}" class="tracking-link" target="_blank">${order.trackingNumber}</a>`;
                        }
                        
                        response += `<br><br>Is there anything else I can help you with?`;
                        return response;
                    } else {
                        return `❌ <strong>Verification Failed</strong><br><br>The recipient name doesn't match our records. Please check and try again, or contact customer support.`;
                    }
                }
            }
            
            // Check if providing order ID (when waiting for it)
            if (conversationState.waitingFor === 'orderId') {
                const orderMatch = message.match(/(BP\d+|TEST\d+|\b\d{3,}\b)/i);
                if (orderMatch) {
                    const orderId = orderMatch[1].toUpperCase();
                    conversationState.tempOrderId = orderId;
                    conversationState.waitingFor = 'recipientName';
                    return `I found order <strong>${orderId}</strong>. 🔍<br><br>For security, please provide the <strong>recipient name</strong> to verify your identity.`;
                } else {
                    return `I couldn't find that order number. Please check and try again with a valid order ID like "BP111".`;
                }
            }
            
            // Default responses
            if (lowerMsg.includes('hello') || lowerMsg.includes('hi')) {
                return "Hello! How can I help you track your order today? 😊";
            }
            
            if (lowerMsg.includes('thank')) {
                return "You're welcome! Feel free to ask if you need anything else. Have a great day! 🌟";
            }
            
            if (lowerMsg.includes('help')) {
                return "I can help you:<br>• Check order status<br>• Track shipping<br>• Answer order-related questions<br><br>Just tell me your order number!";
            }
            
            return "I'm not sure I understand. You can ask me to:<br>• Check your order (e.g., 'Check order BP111')<br>• Ask about order status<br><br>How can I help?";
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Add user message
            addMessage(message, true);
            input.value = '';
            sendBtn.disabled = true;
            
            // Show typing indicator
            const typingDiv = showTyping();
            
            // Simulate AI thinking time
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Remove typing and add AI response
            removeTyping(typingDiv);
            const response = processMessage(message);
            addMessage(response, false);
            
            sendBtn.disabled = false;
            input.focus();
        }

        // Focus input on load
        document.getElementById('userInput').focus();
    </script>
</body>
</html>
