<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刻字自动排版工具（纯自动版）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
        }
        
        .input-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        textarea {
            width: 100%;
            min-height: 80px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
        }
        
        .result-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: none;
        }
        
        .result-section.show {
            display: block;
        }
        
        .result-title {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
            font-weight: 500;
        }
        
        .engraving-preview {
            background: #fafafa;
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 15px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .engraving-line {
            margin: 4px 0;
            font-size: 20px;
            color: #333;
        }
        
        .output-box {
            background: #f0f8ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 15px;
        }
        
        .output-box h3 {
            font-size: 14px;
            color: #1976D2;
            margin-bottom: 10px;
        }
        
        .output-content {
            font-family: monospace;
            font-size: 15px;
            line-height: 1.8;
            color: #333;
            white-space: pre-wrap;
        }
        
        .translation-box {
            background: #fff8e1;
            border-left: 4px solid #FFC107;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 15px;
        }
        
        .translation-box h3 {
            font-size: 14px;
            color: #F57C00;
            margin-bottom: 10px;
        }
        
        .translation-content {
            font-size: 15px;
            line-height: 1.6;
            color: #333;
        }
        
        .warning-highlight {
            background: #FFEBEE;
            color: #C62828;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        
        .alert-box {
            background: #FFEBEE;
            border: 2px solid #EF5350;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: none;
        }
        
        .alert-box.show {
            display: block;
        }
        
        .alert-box h3 {
            color: #C62828;
            font-size: 16px;
            margin-bottom: 8px;
        }
        
        .alert-box p {
            color: #555;
            font-size: 14px;
        }
        
        .copy-btn {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        
        .copy-btn:hover {
            background: #45a049;
        }
        
        .tips {
            margin-top: 20px;
            padding: 15px;
            background: #fff3e0;
            border-radius: 8px;
            border-left: 4px solid #FF9800;
        }
        
        .tips h3 {
            font-size: 14px;
            color: #e65100;
            margin-bottom: 8px;
        }
        
        .tips ul {
            margin-left: 18px;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔤 刻字自动排版工具</h1>
        
        <div class="input-section">
            <label for="input-text">粘贴客户刻字内容（英文）：</label>
            <textarea id="input-text" placeholder="请粘贴英文刻字内容，系统会自动分行..." oninput="autoProcess()"></textarea>
        </div>
        
        <div class="result-section" id="result-section">
            <div class="result-title">📐 自动排版结果（10cm × 10cm）</div>
            
            <div class="alert-box" id="alert-box">
                <h3>⚠️ 发现异常内容</h3>
                <p id="alert-text"></p>
            </div>
            
            <div class="engraving-preview" id="preview"></div>
            
            <div class="translation-box">
                <h3>🔍 中文翻译（供设计师参考）：</h3>
                <div class="translation-content" id="translation"></div>
            </div>
            
            <div class="output-box">
                <h3>📋 给设计师的分行结果（直接复制）：</h3>
                <div class="output-content" id="output"></div>
            </div>
            
            <button class="copy-btn" onclick="copyResult()">📋 复制结果</button>
        </div>
        
        <div class="tips">
            <h3>💡 自动分行规则 & 翻译功能：</h3>
            <ul>
                <li>"Happy Birthday to" 模式在"to"后断行</li>
                <li>固定短语（lots of love、Mommy and Daddy等）保持完整</li>
                <li>句号、感叹号、问号后优先断行</li>
                <li>每行控制在35-40字符</li>
                <li><strong>🔍 自动翻译：</strong>鼠标悬停查看中文释义</li>
                <li><strong>⚠️ 异常检测：</strong>发现"不要"、"订单号"等指令词汇会红字警告</li>
            </ul>
        </div>
    </div>

    <script>
        function autoProcess() {
            const input = document.getElementById('input-text').value.trim();
            const resultSection = document.getElementById('result-section');
            
            if (!input) {
                resultSection.classList.remove('show');
                return;
            }
            
            // 自动分行
            const lines = smartBreak(input);
            
            // 显示预览
            const preview = document.getElementById('preview');
            preview.innerHTML = lines.map(line => 
                `<div class="engraving-line">${escapeHtml(line)}</div>`
            ).join('');
            
            // 显示翻译
            const translation = translateText(input);
            document.getElementById('translation').innerHTML = translation.html;
            
            // 显示异常警告
            const alertBox = document.getElementById('alert-box');
            if (translation.hasWarning) {
                document.getElementById('alert-text').innerHTML = translation.warningMsg;
                alertBox.classList.add('show');
            } else {
                alertBox.classList.remove('show');
            }
            
            // 显示输出
            const output = document.getElementById('output');
            output.textContent = lines.map((line, i) => 
                `第${i + 1}行：${line}`
            ).join('\n');
            
            resultSection.classList.add('show');
        }
        
        function translateText(text) {
            // 简单的翻译字典
            const translations = {
                // 指令性词汇
                'do not': '不要',
                'don\'t': '不要',
                'no': '不要/无',
                'without': '没有',
                'remove': '移除',
                'delete': '删除',
                'change': '更改',
                'modify': '修改',
                'cancel': '取消',
                'order': '订单',
                'sku': 'SKU',
                'model': '型号',
                'style': '款式',
                'option': '选项',
                'custom': '定制',
                'requirements': '要求',
                'attachment': '附件',
                'bead': '木珠',
                'number': '数字',
                'animal': '动物',
                'print': '彩印',
                'color': '颜色',
                'group': '组',
                'row': '行',
                'line': '行',
                'back': '背面',
                'front': '正面',
                'engraving': '刻字',
                'text': '文字',
                'personalized': '个性化',
                'message': '留言',
                
                // 常见刻字内容
                'happy': '快乐',
                'birthday': '生日',
                'to': '给',
                'our': '我们的',
                'sweet': '亲爱的',
                'baby': '宝贝',
                'girl': '女孩',
                'boy': '男孩',
                'love': '爱',
                'from': '来自',
                'mommy': '妈妈',
                'daddy': '爸爸',
                'grandma': '奶奶',
                'grandpa': '爷爷',
                'auntie': '阿姨',
                'uncle': '叔叔',
                'forever': '永远',
                'always': '一直',
                'lots of love': '很多爱',
                'best wishes': '最好的祝福'
            };
            
            let translated = text;
            let hasWarning = false;
            let warningMsg = '';
            
            // 检查是否包含指令性词汇
            const warningWords = ['do not', 'don\'t', 'no', 'without', 'remove', 'delete', 'change', 'modify', 'cancel', 'order', 'sku', 'model', 'style', 'option', 'requirements', 'attachment'];
            
            for (let word of warningWords) {
                if (text.toLowerCase().includes(word)) {
                    hasWarning = true;
                    warningMsg += `发现可能包含<strong>客户指令</strong>的词汇：<span class="warning-highlight">${word}</span> → "${translations[word] || word}"<br>`;
                }
            }
            
            if (hasWarning) {
                warningMsg += '<br>⚠️ <strong>建议：此内容可能不是纯刻字，包含客户订单指令，请找陈总确认！</strong>';
            }
            
            // 逐词翻译（简单替换）
            let html = text;
            for (let [en, zh] of Object.entries(translations)) {
                const regex = new RegExp(`\\b${en}\\b`, 'gi');
                html = html.replace(regex, match => `<span title="${zh}">${match}</span>`);
            }
            
            return {
                html: html,
                hasWarning: hasWarning,
                warningMsg: warningMsg
            };
        }
        
        function smartBreak(text) {
            // HTML解码
            text = text.replace(/&quot;/g, '"')
                       .replace(/&#39;/g, "'")
                       .replace(/&amp;/g, '&')
                       .replace(/&lt;/g, '<')
                       .replace(/&gt;/g, '>')
                       .replace(/&#44;/g, ',')
                       .replace(/&#33;/g, '!')
                       .replace(/&#63;/g, '?')
                       .replace(/&#46;/g, '.');
            
            // 清理空格
            text = text.replace(/\s+/g, ' ').trim();
            
            // 保护固定短语
            const protectedMap = new Map();
            let protectedText = text;
            let counter = 0;
            
            const fixedPhrases = [
                'lots of love', 'happy birthday', 'happy anniversary',
                'mommy and daddy', 'love you', 'miss you',
                'big sister', 'little sister', 'big brother', 'little brother'
            ];
            
            fixedPhrases.forEach(phrase => {
                const regex = new RegExp(phrase, 'gi');
                protectedText = protectedText.replace(regex, match => {
                    const key = `__P${counter++}__`;
                    protectedMap.set(key, match);
                    return key;
                });
            });
            
            // 第1步：Happy X Birthday to 模式断行
            protectedText = protectedText.replace(/(Happy\s+\w+\s+Birthday\s+to)(\s+)/gi, '$1|');
            
            // 第2步：句号、感叹号、问号后断行
            protectedText = protectedText.replace(/([.!?])(\s+)/g, '$1|');
            
            // 第3步：长行在逗号后断行
            let parts = protectedText.split('|');
            let result = [];
            
            parts.forEach(part => {
                part = part.trim();
                if (!part) return;
                
                // 如果太长，在逗号后拆分
                if (part.length > 40) {
                    const subParts = part.split(/,\s+/);
                    let current = '';
                    
                    subParts.forEach((sub, idx) => {
                        if (idx < subParts.length - 1) sub += ',';
                        
                        if (!current) {
                            current = sub;
                        } else if ((current + ' ' + sub).length <= 40) {
                            current += ' ' + sub;
                        } else {
                            result.push(current.trim());
                            current = sub;
                        }
                    });
                    
                    if (current) result.push(current.trim());
                } else {
                    result.push(part);
                }
            });
            
            // 恢复固定短语
            return result.map(line => {
                let restored = line;
                protectedMap.forEach((value, key) => {
                    restored = restored.replace(key, value);
                });
                return restored;
            }).filter(line => line.length > 0);
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function copyResult() {
            const output = document.getElementById('output').textContent;
            navigator.clipboard.writeText(output).then(() => {
                alert('已复制到剪贴板！');
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = output;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('已复制到剪贴板！');
            });
        }
    </script>
</body>
</html>
